<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>벽에 부딪혀 튕기는 공</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    /* 커스텀 슬라이더 스타일 */
    input[type=range] {
      accent-color: #6366f1;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen overflow-hidden flex flex-col p-3 sm:p-5">

  <!-- 메인 컨테이너: 전체 화면에 꼭 맞게 flex-col 및 h-full 구성 -->
  <div class="max-w-5xl w-full mx-auto flex flex-col h-full gap-3 sm:gap-4">
    
    <!-- 상단 헤더: 공간을 적게 차지하도록 컴팩트하게 구성 -->
    <header class="flex items-center justify-between pb-2 border-b border-slate-800 shrink-0 gap-4">
      <div class="flex-1 max-w-sm sm:max-w-md">
        <h1 id="mainTitle" class="text-xl sm:text-2xl font-bold bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
          벽에 부딪혀 튕기는 공
        </h1>
        <p class="text-[11px] sm:text-xs text-slate-400 mb-1.5">직사각형 영역 안에서 공이 벽에 부딪혀 튕기는 시뮬레이션</p>
        
        <!-- 제목 변경 입력창 (헤더 아래로 이동) -->
        <div class="relative flex items-center">
          <i data-lucide="type" class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 pointer-events-none"></i>
          <input 
            id="titleInput" 
            type="text" 
            value="벽에 부딪혀 튕기는 공" 
            placeholder="제목 입력..." 
            maxlength="30"
            class="w-full bg-slate-800/90 border border-slate-700 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-slate-100 text-xs rounded-xl py-1.5 pl-8 pr-2.5 outline-none transition"
          >
        </div>

        <!-- 모양 선택 체크박스 목록 (원형, 사각형, 삼각형, 별, 다이아몬드) -->
        <div class="flex flex-wrap items-center gap-2.5 mt-2 bg-slate-800/60 border border-slate-700/50 rounded-xl px-2.5 py-1.5">
          <span class="text-[11px] font-semibold text-slate-400">활성 모양:</span>
          <label class="flex items-center gap-1 cursor-pointer select-none text-[11px] text-slate-300 hover:text-indigo-300 transition">
            <input type="checkbox" name="shapeOption" value="circle" checked class="shape-chk w-3.5 h-3.5 rounded border-slate-600 text-indigo-600 focus:ring-indigo-500 bg-slate-700">
            <span>원</span>
          </label>
          <label class="flex items-center gap-1 cursor-pointer select-none text-[11px] text-slate-300 hover:text-indigo-300 transition">
            <input type="checkbox" name="shapeOption" value="square" checked class="shape-chk w-3.5 h-3.5 rounded border-slate-600 text-indigo-600 focus:ring-indigo-500 bg-slate-700">
            <span>사각형</span>
          </label>
          <label class="flex items-center gap-1 cursor-pointer select-none text-[11px] text-slate-300 hover:text-indigo-300 transition">
            <input type="checkbox" name="shapeOption" value="triangle" checked class="shape-chk w-3.5 h-3.5 rounded border-slate-600 text-indigo-600 focus:ring-indigo-500 bg-slate-700">
            <span>삼각형</span>
          </label>
          <label class="flex items-center gap-1 cursor-pointer select-none text-[11px] text-slate-300 hover:text-indigo-300 transition">
            <input type="checkbox" name="shapeOption" value="star" checked class="shape-chk w-3.5 h-3.5 rounded border-slate-600 text-indigo-600 focus:ring-indigo-500 bg-slate-700">
            <span>별</span>
          </label>
          <label class="flex items-center gap-1 cursor-pointer select-none text-[11px] text-slate-300 hover:text-indigo-300 transition">
            <input type="checkbox" name="shapeOption" value="diamond" checked class="shape-chk w-3.5 h-3.5 rounded border-slate-600 text-indigo-600 focus:ring-indigo-500 bg-slate-700">
            <span>다이아몬드</span>
          </label>
        </div>
      </div>
      <!-- 별점 스크롤(슬라이더) 평가 및 충돌 카운터 배지 영역 -->
      <div class="flex flex-col sm:flex-row items-end sm:items-center gap-2 self-start mt-1">
        <!-- 스크롤(슬라이더) 조절 방식 별점 컴포넌트 -->
        <div class="bg-slate-800/90 border border-slate-700/60 rounded-xl px-3 py-1.5 flex flex-col gap-1 shadow-inner min-w-[150px]">
          <div class="flex items-center justify-between text-[11px]">
            <span class="text-slate-400 font-medium">별점 평가</span>
            <div class="flex items-center gap-1">
              <span id="starDisplay" class="flex text-amber-400 text-xs">★★★★★</span>
              <span id="ratingScoreText" class="text-amber-400 font-bold tabular-nums">5.0점</span>
            </div>
          </div>
          <input 
            id="ratingSlider" 
            type="range" 
            min="0.5" 
            max="5" 
            step="0.5" 
            value="5" 
            class="w-full h-1.5 bg-slate-700 rounded-lg cursor-pointer accent-amber-400"
            title="스크롤/슬라이드하여 별점을 선택하세요"
          >
        </div>

        <!-- 충돌 카운터 배지 -->
        <div class="bg-slate-800/90 border border-slate-700/60 rounded-xl px-3 py-2 flex items-center gap-2 shadow-inner h-full">
          <i data-lucide="zap" class="w-3.5 h-3.5 text-amber-400"></i>
          <span class="text-[11px] text-slate-400">충돌 횟수:</span>
          <span id="bounceCounter" class="text-xs sm:text-sm font-semibold text-amber-400 tabular-nums">0</span>
        </div>
      </div>
    </header>

    <!-- 시뮬레이션 캔버스 영역: 남은 뷰포트 높이를 전부 차지하도록 flex-1 적용 -->
    <div class="relative w-full flex-1 min-h-0 bg-slate-950 rounded-2xl border-2 border-slate-700/80 shadow-2xl overflow-hidden">
      <canvas id="simCanvas" class="w-full h-full block cursor-crosshair"></canvas>
      
      <!-- 일시정지 상태 오버레이 뱃지 -->
      <div id="pauseBadge" class="hidden absolute top-3 left-3 bg-amber-500/20 border border-amber-500/40 text-amber-300 px-2.5 py-1 rounded-full text-xs font-semibold backdrop-blur-md flex items-center gap-1.5 shadow-lg">
        <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
        일시정지됨
      </div>

      <!-- 클릭 시 안내 힌트 -->
      <div class="absolute bottom-2.5 right-3 text-[11px] text-slate-500 pointer-events-none select-none hidden sm:block">
        캔버스를 클릭하면 해당 위치에 새로운 공이 생성됩니다
      </div>
    </div>

    <!-- 하단 컨트롤 패널: shrink-0으로 크기 축소 방지 -->
    <div class="bg-slate-800/70 border border-slate-700/60 backdrop-blur-md rounded-2xl p-3 sm:p-4 shadow-xl shrink-0">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4 items-center">
        
        <!-- 제어 버튼 (재생/정지, 리셋) -->
        <div class="flex items-center gap-2">
          <button id="togglePlayBtn" class="flex-1 flex items-center justify-center gap-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm font-medium py-2 px-3 rounded-xl transition duration-200 shadow-md shadow-indigo-600/30 active:scale-[0.98]">
            <i id="playIcon" data-lucide="pause" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
            <span id="playBtnText">정지</span>
          </button>
          <button id="resetBtn" title="초기화" class="p-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl transition duration-200 active:scale-[0.98]">
            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
          </button>
        </div>

        <!-- 색상 변경 버튼 -->
        <div class="flex items-center">
          <button id="randomColorBtn" class="w-full flex items-center justify-center gap-1.5 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-400 hover:to-rose-400 text-white text-xs sm:text-sm font-medium py-2 px-3 rounded-xl transition duration-200 shadow-md shadow-rose-500/25 active:scale-[0.98]">
            <i data-lucide="palette" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
            <span>색상 변경</span>
          </button>
        </div>

        <!-- 속도 조절 슬라이더 -->
        <div class="flex flex-col gap-1">
          <div class="flex justify-between text-[11px] sm:text-xs font-medium text-slate-300">
            <span>속도</span>
            <span id="speedValue" class="text-indigo-400 font-semibold tabular-nums">1.0x</span>
          </div>
          <input id="speedSlider" type="range" min="0.2" max="3" step="0.1" value="1.0" class="w-full h-1.5 bg-slate-700 rounded-lg cursor-pointer">
        </div>

        <!-- 공 크기 조절 슬라이더 -->
        <div class="flex flex-col gap-1">
          <div class="flex justify-between text-[11px] sm:text-xs font-medium text-slate-300">
            <span>공 크기</span>
            <span id="radiusValue" class="text-indigo-400 font-semibold tabular-nums">20px</span>
          </div>
          <input id="radiusSlider" type="range" min="10" max="45" step="1" value="20" class="w-full h-1.5 bg-slate-700 rounded-lg cursor-pointer">
        </div>
      </div>
    </div>

  </div>

  <!-- 동작 스크립트 -->
  <script>
    // 캔버스 및 콘텍스트 설정
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    // UI 요소
    const mainTitle = document.getElementById('mainTitle');
    const titleInput = document.getElementById('titleInput');
    const shapeCheckboxes = document.querySelectorAll('.shape-chk');
    const ratingSlider = document.getElementById('ratingSlider');
    const ratingScoreText = document.getElementById('ratingScoreText');
    const starDisplay = document.getElementById('starDisplay');
    const togglePlayBtn = document.getElementById('togglePlayBtn');
    const playBtnText = document.getElementById('playBtnText');
    const playIcon = document.getElementById('playIcon');
    const resetBtn = document.getElementById('resetBtn');
    const randomColorBtn = document.getElementById('randomColorBtn');
    const speedSlider = document.getElementById('speedSlider');
    const speedValue = document.getElementById('speedValue');
    const radiusSlider = document.getElementById('radiusSlider');
    const radiusValue = document.getElementById('radiusValue');
    const bounceCounter = document.getElementById('bounceCounter');
    const pauseBadge = document.getElementById('pauseBadge');

    // 시뮬레이션 상태 변수
    let isRunning = true;
    let bounceCount = 0;
    let speedMultiplier = 1.0;
    let currentRadius = 20;
    let enableTrail = true;
    let animationId = null;
    let balls = [];

    // 생동감 있는 색상 팔레트 목록
    const vibrantColors = [
      '#EF4444', '#F97316', '#F59E0B', '#10B981', 
      '#06B6D4', '#3B82F6', '#6366F1', '#8B5CF6', 
      '#EC4899', '#F43F5E', '#14B8A6', '#84CC16',
      '#A855F7', '#E11D48', '#0EA5E9', '#D97706'
    ];

    // 색상 Hex를 투명한 rgba로 변환
    function hexToRgba(hex, alpha) {
      hex = hex.replace('#', '');
      if (hex.length === 3) {
        hex = hex.split('').map(c => c + c).join('');
      }
      const r = parseInt(hex.substring(0, 2), 16);
      const g = parseInt(hex.substring(2, 4), 16);
      const b = parseInt(hex.substring(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    // 단일 모양의 공 생성 함수
    function createBallByShape(shape, customX, customY) {
      const rect = canvas.getBoundingClientRect();
      const w = rect.width || 600;
      const h = rect.height || 400;
      const r = currentRadius;

      const x = customX !== undefined ? Math.max(r, Math.min(customX, w - r)) : r + Math.random() * (w - 2 * r);
      const y = customY !== undefined ? Math.max(r, Math.min(customY, h - r)) : r + Math.random() * (h - 2 * r);

      const angle = Math.random() * Math.PI * 2;
      const speed = 3.5 + Math.random() * 3.5;
      const color = vibrantColors[Math.floor(Math.random() * vibrantColors.length)];

      return {
        x,
        y,
        radius: r,
        baseVx: Math.cos(angle) * speed,
        baseVy: Math.sin(angle) * speed,
        color: color,
        glowColor: hexToRgba(color, 0.45),
        shape: shape,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.08
      };
    }

    // 별 모양 경로 그리기
    function drawStarShape(ctx, cx, cy, spikes, outerRadius, innerRadius) {
      let rot = Math.PI / 2 * 3;
      let x = cx;
      let y = cy;
      const step = Math.PI / spikes;

      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;

        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
    }

    // 삼각형 경로 그리기
    function drawTriangleShape(ctx, radius) {
      ctx.beginPath();
      const topY = -radius * 1.15;
      const bottomY = radius * 0.85;
      const sideX = radius * 1.1;
      ctx.moveTo(0, topY);
      ctx.lineTo(sideX, bottomY);
      ctx.lineTo(-sideX, bottomY);
      ctx.closePath();
    }

    // 다이아몬드 경로 그리기
    function drawDiamondShape(ctx, radius) {
      ctx.beginPath();
      ctx.moveTo(0, -radius * 1.25);
      ctx.lineTo(radius * 0.95, 0);
      ctx.lineTo(0, radius * 1.25);
      ctx.lineTo(-radius * 0.95, 0);
      ctx.closePath();
    }

    // 별점 스크롤(슬라이더) UI 갱신 함수
    function updateRating(val) {
      const rating = parseFloat(val);
      ratingScoreText.textContent = `${rating.toFixed(1)}점`;
      
      const fullStars = Math.floor(rating);
      const halfStar = (rating % 1 !== 0);
      const emptyStars = 5 - Math.ceil(rating);
      
      starDisplay.textContent = '★'.repeat(fullStars) + (halfStar ? '½' : '') + '☆'.repeat(emptyStars);
    }

    // 슬라이더 조절 및 마우스 휠 스크롤 지원
    ratingSlider.addEventListener('input', (e) => {
      updateRating(e.target.value);
    });

    ratingSlider.parentElement.addEventListener('wheel', (e) => {
      e.preventDefault();
      let currentVal = parseFloat(ratingSlider.value);
      if (e.deltaY < 0) {
        currentVal = Math.min(5, currentVal + 0.5);
      } else {
        currentVal = Math.max(0.5, currentVal - 0.5);
      }
      ratingSlider.value = currentVal;
      updateRating(currentVal);
    }, { passive: false });

    // 체크박스 클릭에 따라 해당 모양의 공 추가 / 즉시 완전 제거 (모양별 1개 동기화)
    function syncShapes() {
      // 1. 체크된 모양 목록 추출
      const activeShapes = Array.from(shapeCheckboxes)
        .filter(chk => chk.checked)
        .map(chk => chk.value);

      // 2. 체크 해제된 모양의 공은 즉시 배열에서 완전히 제거
      balls = balls.filter(b => activeShapes.includes(b.shape));

      // 3. 새로 체크된 모양 중 아직 생성되지 않은 공은 1개씩 추가
      activeShapes.forEach(shape => {
        if (!balls.some(b => b.shape === shape)) {
          balls.push(createBallByShape(shape));
        }
      });

      // 4. 공이 제거되었을 때 잔상이 남지 않도록 즉시 클리어 후 재렌더링
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      drawFrame();
    }

    shapeCheckboxes.forEach(chk => {
      chk.addEventListener('change', syncShapes);
    });

    // 모든 공의 색상 무작위 변경 함수
    function changeAllColors() {
      balls.forEach(b => {
        const nextColor = vibrantColors[Math.floor(Math.random() * vibrantColors.length)];
        b.color = nextColor;
        b.glowColor = hexToRgba(nextColor, 0.45);
      });
      if (!isRunning) drawFrame();
    }

    // 캔버스 고해상도 리사이징 (DPI 대응)
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;

      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;

      ctx.resetTransform?.();
      ctx.scale(dpr, dpr);

      const w = rect.width;
      const h = rect.height;

      balls.forEach(b => {
        if (b.x + b.radius > w) b.x = Math.max(b.radius, w - b.radius);
        if (b.x - b.radius < 0) b.x = b.radius;
        if (b.y + b.radius > h) b.y = Math.max(b.radius, h - b.radius);
        if (b.y - b.radius < 0) b.y = b.radius;
      });

      if (!isRunning) drawFrame();
    }

    // 체크된 모양들에 맞춰 공 리스트 초기화 (모양당 1개씩)
    function syncBallsWithCheckboxes() {
      balls = [];
      const activeShapes = Array.from(shapeCheckboxes)
        .filter(chk => chk.checked)
        .map(chk => chk.value);

      activeShapes.forEach(shape => {
        balls.push(createBallByShape(shape));
      });

      bounceCount = 0;
      bounceCounter.textContent = bounceCount;

      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      drawFrame();
    }

    // 캔버스 프레임 렌더링
    function drawFrame() {
      const rect = canvas.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;

      // 배경 그리기: 잔상 효과
      if (enableTrail) {
        ctx.fillStyle = 'rgba(2, 6, 23, 0.25)';
        ctx.fillRect(0, 0, w, h);
      } else {
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#020617';
        ctx.fillRect(0, 0, w, h);
      }

      // 격자선 가이드
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      const step = 40;
      for (let x = 0; x < w; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }
      for (let y = 0; y < h; y += step) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }

      // 모든 공 렌더링
      balls.forEach(b => {
        ctx.save();
        ctx.shadowColor = b.glowColor;
        ctx.shadowBlur = 14;

        // 공 입체 그라디언트 채우기
        const gradient = ctx.createRadialGradient(
          b.x - b.radius * 0.3,
          b.y - b.radius * 0.3,
          b.radius * 0.1,
          b.x,
          b.y,
          b.radius
        );
        gradient.addColorStop(0, '#ffffff');
        gradient.addColorStop(0.3, b.color);
        gradient.addColorStop(1, hexToRgba(b.color, 0.85));

        ctx.fillStyle = gradient;

        ctx.save();
        ctx.translate(b.x, b.y);
        if (b.shape !== 'circle') {
          ctx.rotate(b.rotation);
        }

        switch (b.shape) {
          case 'square': {
            const size = b.radius * 1.7;
            ctx.beginPath();
            ctx.roundRect 
              ? ctx.roundRect(-size / 2, -size / 2, size, size, 5)
              : ctx.rect(-size / 2, -size / 2, size, size);
            ctx.fill();
            break;
          }
          case 'triangle': {
            drawTriangleShape(ctx, b.radius);
            ctx.fill();
            break;
          }
          case 'star': {
            drawStarShape(ctx, 0, 0, 5, b.radius * 1.25, b.radius * 0.6);
            ctx.fill();
            break;
          }
          case 'diamond': {
            drawDiamondShape(ctx, b.radius);
            ctx.fill();
            break;
          }
          case 'circle':
          default: {
            ctx.beginPath();
            ctx.arc(0, 0, b.radius, 0, Math.PI * 2);
            ctx.fill();
            break;
          }
        }

        ctx.restore();
        ctx.restore();
      });
    }

    // 물리 업데이트 및 충돌 검사
    function updatePhysics() {
      const rect = canvas.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;

      let bouncedThisFrame = 0;

      balls.forEach(b => {
        const vx = b.baseVx * speedMultiplier;
        const vy = b.baseVy * speedMultiplier;

        b.x += vx;
        b.y += vy;
        b.rotation += b.rotSpeed * speedMultiplier;

        let bounced = false;

        // 좌/우 벽 충돌
        if (b.x + b.radius >= w) {
          b.x = w - b.radius;
          b.baseVx = -Math.abs(b.baseVx);
          bounced = true;
        } else if (b.x - b.radius <= 0) {
          b.x = b.radius;
          b.baseVx = Math.abs(b.baseVx);
          bounced = true;
        }

        // 상/하 벽 충돌
        if (b.y + b.radius >= h) {
          b.y = h - b.radius;
          b.baseVy = -Math.abs(b.baseVy);
          bounced = true;
        } else if (b.y - b.radius <= 0) {
          b.y = b.radius;
          b.baseVy = Math.abs(b.baseVy);
          bounced = true;
        }

        if (bounced) bouncedThisFrame++;
      });

      if (bouncedThisFrame > 0) {
        bounceCount += bouncedThisFrame;
        bounceCounter.textContent = bounceCount;
      }
    }

    // 메인 애니메이션 루프
    function animate() {
      if (isRunning) {
        updatePhysics();
        drawFrame();
        animationId = requestAnimationFrame(animate);
      }
    }

    // 실행 / 일시정지 전환
    function toggleSimulation() {
      isRunning = !isRunning;
      if (isRunning) {
        playBtnText.textContent = '정지';
        playIcon.setAttribute('data-lucide', 'pause');
        pauseBadge.classList.add('hidden');
        animate();
      } else {
        playBtnText.textContent = '시작';
        playIcon.setAttribute('data-lucide', 'play');
        pauseBadge.classList.remove('hidden');
        cancelAnimationFrame(animationId);
      }
      lucide.createIcons();
    }

    // 이벤트 리스너 연결
    togglePlayBtn.addEventListener('click', toggleSimulation);
    randomColorBtn.addEventListener('click', changeAllColors);

    // 제목 실시간 입력 이벤트
    titleInput.addEventListener('input', (e) => {
      const newTitle = e.target.value.trim();
      const displayTitle = newTitle.length > 0 ? newTitle : '벽에 부딪혀 튕기는 공';
      mainTitle.textContent = displayTitle;
      document.title = displayTitle;
    });

    // 리셋 버튼
    resetBtn.addEventListener('click', () => {
      syncBallsWithCheckboxes();
      if (!isRunning) drawFrame();
    });

    // 속도 슬라이더
    speedSlider.addEventListener('input', (e) => {
      speedMultiplier = parseFloat(e.target.value);
      speedValue.textContent = `${speedMultiplier.toFixed(1)}x`;
    });

    // 공 크기 슬라이더
    radiusSlider.addEventListener('input', (e) => {
      currentRadius = parseInt(e.target.value, 10);
      radiusValue.textContent = `${currentRadius}px`;

      const rect = canvas.getBoundingClientRect();
      balls.forEach(b => {
        b.radius = currentRadius;
        if (b.x + b.radius > rect.width) b.x = rect.width - b.radius;
        if (b.x - b.radius < 0) b.x = b.radius;
        if (b.y + b.radius > rect.height) b.y = rect.height - b.radius;
        if (b.y - b.radius < 0) b.y = b.radius;
      });

      if (!isRunning) drawFrame();
    });

    // 화면 크기 변경 시 대응
    window.addEventListener('resize', resizeCanvas);

    // 초기 실행
    window.onload = () => {
      lucide.createIcons();
      resizeCanvas();
      syncBallsWithCheckboxes();
      animate();
    };
  </script>
</body>
</html>
